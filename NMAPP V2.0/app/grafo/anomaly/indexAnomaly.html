<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafo de Escaneo NMAP</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- Agregamos Font Awesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script src="https://unpkg.com/compromise"></script>
</head>
<body>
    <div class="container">
        <!-- Chatbot -->
        <div id="chat-container" class="chat-closed">
            <!-- Botón para expandir o cerrar el chat -->
            <div id="toggleChatButton" onclick="toggleChat()">
                <i class="fas fa-robot"></i>
            </div>
            <!-- Formulario de entrada de pregunta más grande -->
            <div id="chat-input">
                <input type="text" id="input" placeholder="Preguntar al chatbot...">
                <button onclick="sendMessage()">Enviar</button>
            </div>
            <!-- Contenedor para el chat -->
            <div id="chat-box"></div>
        </div>
        <!-- SVG -->
        <svg></svg>

        <!-- Pop-up de información -->
        <div class="popup" id="infoPopup">
            <div class="popup-content">
                <h3>Preguntas Sugeridas</h3>
                <button onclick="insertQuestion('¿Cuáles son los nodos en el grupo 1?')">Nodos en grupo 1</button>
                <button onclick="insertQuestion('Dime información sobre el nodo \'http:443\'.')">Información sobre nodo http:443</button>
                <button onclick="insertQuestion('¿Qué nodos tienen vulnerabilidades?')">Nodos con vulnerabilidades</button>
                <button onclick="insertQuestion('¿Cuál es el valor promedio de los enlaces?')">Valor promedio de enlaces</button>
                <!-- Agrega más preguntas sugeridas aquí -->
            </div>
        </div>

        <!-- Botón de información -->
        <div class="info-button" onclick="toggleInfoPopup()">
            <i class="fas fa-info"></i>
        </div>

        <!-- Tooltip e información -->
        <div id="tooltip"></div>

        <!-- Leyenda -->
        <div id="legend">
            <h3>Leyenda</h3>
            <ul>
                <li><span class="ip">IP</span>: Direcciones IP</li>
                <li><span class="servicio">Servicio Común</span>: Puertos y servicios comunes</li>
                <li><span class="anomalo">Anómalo</span>: Puertos y servicios anómalos</li>
            </ul>
        </div>
    </div>

    <script src="scriptPorts.js"></script>
    <script src="chatbot.js"></script>
    <script>
        function toggleChat() {
            const chatContainer = document.getElementById('chat-container');
            chatContainer.classList.toggle('chat-closed');

            const toggleButtonIcon = document.querySelector('#toggleChatButton i');
            toggleButtonIcon.classList.toggle('fa-robot');
            toggleButtonIcon.classList.toggle('fa-times');
        }

        function toggleInfoPopup() {
            const popup = document.getElementById('infoPopup');
            popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
        }

        function insertQuestion(question) {
            document.getElementById("input").value = question;
            toggleInfoPopup(); // Cierra el pop-up después de insertar la pregunta
        }
    </script>
</body>
</html>
