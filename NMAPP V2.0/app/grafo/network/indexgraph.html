<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visualización de Red con D3.js</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://d3js.org/d3.v3.min.js"></script>
</head>
<body>

  <div class="container">
    <div class="search-container">
        <input type="text" id="searchIpInput" placeholder="Buscar por IP..." list="searchIpInputList">
        <datalist id="searchIpInputList"></datalist>

        <input type="text" id="searchPortInput" placeholder="Buscar por puerto..." list="searchPortInputList">
        <datalist id="searchPortInputList"></datalist>

        <input type="text" id="searchServiceInput" placeholder="Buscar por servicio..." list="searchServiceInputList">
        <datalist id="searchServiceInputList"></datalist>
    </div>

    <table class="node-details">
        <thead>
            <tr>
                <th>IP</th>
                <th>Puerto</th>
                <th>Servicio</th>
            </tr>
        </thead>
        <tbody id="nodeDetails">
        </tbody>
    </table>
</div>

<script src="script.js"></script>

</body>
</html>
